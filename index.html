<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap.js Interactive Demo Cluster</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #f8fafc; height: 150vh; margin: 0; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; }
    .btn { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 1rem; }
    .popover { background: #1e293b; border: 1px solid #334155; padding: 16px; border-radius: 8px; width: 240px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); display: none; }
    .popover.active { display: block; }
    .popover h4 { margin: 0 0 8px 0; color: #60a5fa; }
    .popover p { margin: 0; font-size: 0.875rem; color: #94a3b8; line-height: 1.4; }
  </style>
</head>
<body>

<div class="container">
  <button id="trigger" class="btn">Interact / Open Popover</button>
  <div id="dropdown" class="popover">
    <h4>Boundary Floating Engine</h4>
    <p>This layout container is positioned using mathematical coordinate clamping routines to guarantee zero screen overflow bounds.</p>
  </div>
</div>

<script type="module">
  import { autoSnap } from './snap.js';
  
  const trigger = document.getElementById('trigger');
  const dropdown = document.getElementById('dropdown');
  let clearTracker = null;

  trigger.addEventListener('click', () => {
    dropdown.classList.toggle('active');
    if (dropdown.classList.contains('active')) {
      clearTracker = autoSnap(trigger, dropdown, { position: 'top', offset: 12 });
    } else if (clearTracker) {
      clearTracker();
    }
  });
</script>
</body>
</html>
